name: Release — Automated Cross-Platform Packaging

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release Bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Code Stage is Ready for Release
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "package.json") -or -not (Test-Path -LiteralPath "src-tauri/Cargo.toml")) {
            Write-Error "Cannot build a release before Stage 1+ code and tests are merged."
            exit 1
          }

      - name: Install Linux System Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Run Full Test Suite Before Packaging
        shell: pwsh
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
          Push-Location src-tauri
          cargo test --all-targets
          Pop-Location

      - name: Build Tauri Release Bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Rawaq ${{ github.ref_name }}"
          releaseBody: "إصدار مبني ومختبر تلقائيًا عبر GitHub Actions على Windows وmacOS وLinux."
          releaseDraft: false
          prerelease: false

      - name: Generate and Upload Per-Platform SHA256 Checksums
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $bundleDir = "src-tauri/target/release/bundle"
          if (Test-Path -LiteralPath $bundleDir) {
            $files = Get-ChildItem -Path $bundleDir -Recurse -File | Where-Object { $_.Extension -match '\.(msi|exe|dmg|AppImage|deb|zip|tar\.gz)$' }
            $sums = @()
            foreach ($f in $files) {
              $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
              $sums += "$hash  $($f.Name)"
            }
            if ($sums.Count -gt 0) {
              $sumsContent = ($sums | Sort-Object) -join "`n"
              Set-Content -Path "SHA256SUMS-${{ matrix.os }}.txt" -Value $sumsContent -Encoding utf8
              gh release upload ${{ github.ref_name }} "SHA256SUMS-${{ matrix.os }}.txt" --clobber
            }
          }

  aggregate-checksums:
    name: Aggregate & Publish Canonical SHA256SUMS
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download & Merge Checksums into Canonical SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./checksums
          gh release download ${{ github.ref_name }} --pattern "SHA256SUMS-*.txt" --dir ./checksums || true
          if ls ./checksums/SHA256SUMS-*.txt 1> /dev/null 2>&1; then
            cat ./checksums/SHA256SUMS-*.txt | sort -u > SHA256SUMS.txt
            gh release upload ${{ github.ref_name }} SHA256SUMS.txt --clobber
          fi
