[package]
name = "rawaq"
version = "0.1.0"
description = "Rawaq (رَوَاق) — Cross-platform BiDi desktop organizer"
authors = ["Rawaq Contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "rawaq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.35", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tempfile = "3"
thiserror = "2"
